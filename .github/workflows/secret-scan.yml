# Checks every push for keys, personal email addresses and photos (see scripts/check-secrets.sh).
# If it fails, GitHub emails the repo owner.
name: Sensitive data check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: bash scripts/check-secrets.sh --all
